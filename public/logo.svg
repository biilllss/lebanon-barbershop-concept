<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 110" width="280" height="110" role="img" aria-labelledby="title">
  <title id="title">Blade &amp; Cedar Logo</title>
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A6852A"/>
      <stop offset="100%" stop-color="#C9A24B"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Scissors — left blade -->
    <path d="M60 55 L30 35" stroke="url(#goldGrad)" stroke-width="5"/>
    <path d="M60 55 L30 75" stroke="url(#goldGrad)" stroke-width="5"/>
    <circle cx="42" cy="55" r="6" fill="#121212" stroke="url(#goldGrad)" stroke-width="2"/>
    <path d="M30 35 L20 25 M30 75 L20 85" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
    <!-- Scissors — right blade -->
    <path d="M60 55 L90 35" stroke="url(#goldGrad)" stroke-width="5"/>
    <path d="M60 55 L90 75" stroke="url(#goldGrad)" stroke-width="5"/>
    <circle cx="78" cy="55" r="6" fill="#121212" stroke="url(#goldGrad)" stroke-width="2"/>
    <path d="M90 35 L100 25 M90 75 L100 85" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
    <!-- Cedar branch detail -->
    <path d="M90 55 Q100 50 110 55 T125 55" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>
    <circle cx="100" cy="48" r="3" fill="#8B4513"/>
    <circle cx="110" cy="60" r="3" fill="#8B4513"/>
    <!-- Brand text -->
    <text x="145" y="62" font-family="Georgia, Playfair Display, serif" font-size="36" font-weight="700" fill="#F2EDE4" letter-spacing="-0.5">BLADE</text>
    <text x="230" y="62" font-family="Georgia, Playfair Display, serif" font-size="36" font-weight="700" fill="url(#goldGrad)" letter-spacing="-0.5">CEDAR</text>
    <!-- Tagline -->
    <text x="145" y="85" font-family="Inter, ui-sans-serif, sans-serif" font-size="14" fill="#CCCCCC">Barbershop • Beirut</text>
  </g>
</svg>
