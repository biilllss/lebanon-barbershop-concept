<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Cedar wood and barber tools">
  <defs>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#g3)"/>
  <g transform="translate(300 330)" opacity="0.9">
    <!-- Cedar plank background -->
    <rect x="-180" y="-180" width="360" height="360" rx="16" fill="#8B4513" opacity="0.4"/>
    <line x1="-180" y1="-160" x2="180" y2="-160" stroke="#8B4513" stroke-width="1" opacity="0.6"/>
    <line x1="-180" y1="-120" x2="180" y2="-120" stroke="#8B4513" stroke-width="1" opacity="0.6"/>
    <line x1="-180" y1="-80" x2="180" y2="-80" stroke="#8B4513" stroke-width="1" opacity="0.6"/>
    <line x1="-180" y1="-40" x2="180" y2="-40" stroke="#8B4513" stroke-width="1" opacity="0.6"/>
    <line x1="-180" y1="0" x2="180" y2="0" stroke="#8B4513" stroke-width="1" opacity="0.6"/>
    <line x1="-180" y1="40" x2="180" y2="40" stroke="#8B4513" stroke-width="1" opacity="0.6"/>
    <line x1="-180" y1="80" x2="180" y2="80" stroke="#8B4513" stroke-width="1" opacity="0.6"/>
    <!-- Tools on wood -->
    <g stroke="#C9A24B" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M-100 -10 L-60 -50 M-100 -10 L-60 30"/>
      <circle cx="-80" cy="-10" r="6" fill="#121212" stroke="#C9A24B" stroke-width="2"/>
      <path d="M-60 -50 L20 -50 M-60 30 L20 30"/>
      <circle cx="-20" cy="-10" r="6" fill="#121212" stroke="#C9A24B" stroke-width="2"/>
    </g>
    <g transform="translate(100 20)" stroke="#F2EDE4" stroke-width="3" fill="none">
      <path d="M0 0 L40 -30 M0 0 L40 30"/>
      <circle cx="20" cy="0" r="5" fill="#F2EDE4"/>
    </g>
  </g>
</svg>
