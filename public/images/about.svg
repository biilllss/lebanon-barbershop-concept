<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Barber tools and cedar wood">
  <defs>
    <linearGradient id="aboutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#aboutGrad)"/>
  <g transform="translate(400 300)" opacity="0.85">
    <!-- Cedar wood plank texture -->
    <rect x="-200" y="-150" width="400" height="300" rx="12" fill="#8B4513" opacity="0.4"/>
    <line x1="-200" y1="-140" x2="200" y2="-140" stroke="#8B4513" stroke-width="1" opacity="0.6"/>
    <line x1="-200" y1="-100" x2="200" y2="-100" stroke="#8B4513" stroke-width="1" opacity="0.6"/>
    <line x1="-200" y1="-60" x2="200" y2="-60" stroke="#8B4513" stroke-width="1" opacity="0.6"/>
    <line x1="-200" y1="-20" x2="200" y2="-20" stroke="#8B4513" stroke-width="1" opacity="0.6"/>
    <line x1="-200" y1="20" x2="200" y2="20" stroke="#8B4513" stroke-width="1" opacity="0.6"/>
    <line x1="-200" y1="60" x2="200" y2="60" stroke="#8B4513" stroke-width="1" opacity="0.6"/>
    <line x1="-200" y1="100" x2="200" y2="100" stroke="#8B4513" stroke-width="1" opacity="0.6"/>
    <line x1="-200" y1="140" x2="200" y2="140" stroke="#8B4513" stroke-width="1" opacity="0.6"/>
    <!-- Scissors on wood -->
    <g stroke="#C9A24B" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M-80 -40 L-40 -70 M-80 -40 L-40 -10"/>
      <circle cx="-60" cy="-40" r="5" fill="#121212" stroke="#C9A24B" stroke-width="2"/>
      <path d="M-80 -40 L-60 20" stroke-linecap="round"/>
      <path d="M-40 -70 L-30 -90 M-40 -10 L-30 20"/>
      <path d="M-40 -70 L20 -70 M-40 -10 L20 -10"/>
      <circle cx="-10" cy="-40" r="5" fill="#121212" stroke="#C9A24B" stroke-width="2"/>
      <path d="M20 -70 L60 -70 M20 -10 L60 -10"/>
      <circle cx="40" cy="-40" r="5" fill="#121212" stroke="#C9A24B" stroke-width="2"/>
    </g>
    <!-- Comb -->
    <g transform="translate(0 100)" stroke="#F2EDE4" stroke-width="3" fill="none">
      <path d="M-40 -15 L40 -15 L40 15 L-40 15z"/>
      <path d="M-40 -15 L-60 -5 M-40 15 L-60 25"/>
      <path d="M40 -15 L60 -5 M40 15 L60 25"/>
      <circle cx="-30" cy="0" r="4" fill="#F2EDE4"/>
      <circle cx="0" cy="0" r="4" fill="#F2EDE4"/>
      <circle cx="30" cy="0" r="4" fill="#F2EDE4"/>
    </g>
  </g>
</svg>
