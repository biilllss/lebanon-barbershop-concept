<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Scissors and comb on leather">
  <defs>
    <linearGradient id="g0" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#g0)"/>
  <g transform="translate(300 320)" opacity="0.9">
    <!-- Leather surface -->
    <ellipse cx="0" cy="0" rx="180" ry="30" fill="#8B4513" opacity="0.5"/>
    <!-- Scissors -->
    <g stroke="#C9A24B" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-100 -20 L-40 -60 M-100 -20 L-40 20"/>
      <circle cx="-70" cy="-20" r="7" fill="#121212" stroke="#C9A24B" stroke-width="2"/>
      <path d="M-40 -60 L-20 -80 M-40 20 L-20 80"/>
      <circle cx="-30" cy="0" r="7" fill="#121212" stroke="#C9A24B" stroke-width="2"/>
      <path d="M-20 -80 L20 -80 M-20 80 L20 80"/>
      <path d="M20 -80 L60 -60 M20 80 L60 60"/>
      <circle cx="40" cy="0" r="7" fill="#121212" stroke="#C9A24B" stroke-width="2"/>
    </g>
    <!-- Comb -->
    <g transform="translate(120 10)" stroke="#F2EDE4" stroke-width="3" fill="none">
      <rect x="0" y="-12" width="130" height="24" rx="4"/>
      <circle cx="20" cy="0" r="5" fill="#F2EDE4"/>
      <circle cx="40" cy="0" r="5" fill="#F2EDE4"/>
      <circle cx="60" cy="0" r="5" fill="#F2EDE4"/>
      <circle cx="80" cy="0" r="5" fill="#F2EDE4"/>
      <circle cx="100" cy="0" r="5" fill="#F2EDE4"/>
    </g>
  </g>
</svg>
