<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Mirror reflection of finished haircut">
  <defs>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#g4)"/>
  <g transform="translate(300 310)" opacity="0.85">
    <!-- Mirror frame -->
    <rect x="-140" y="-140" width="280" height="280" rx="140" fill="#CCCCCC" opacity="0.1"/>
    <circle cx="0" cy="0" r="120" fill="#000000" opacity="0.4"/>
    <!-- Face/hair reflection -->
    <circle cx="0" cy="0" r="50" fill="#C9A24B" opacity="0.5"/>
    <path d="M-50 20 Q0 -10 50 20 Q0 40 -50 20z" fill="#F2EDE4" opacity="0.6"/>
    <!-- Scissors reflection -->
    <g transform="translate(0 80)" stroke="#C9A24B" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5">
      <path d="M-30 0 L0 -20 M-30 0 L0 20"/>
      <path d="M0 -20 L30 -30 M0 20 L30 30"/>
      <circle cx="0" cy="0" r="4" fill="#C9A24B"/>
    </g>
  </g>
</svg>
