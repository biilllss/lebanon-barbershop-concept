<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2100 1000" width="2100" height="1000" role="img" aria-label="Blade &amp; Cedar barbershop interior">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <pattern id="fadeStripes" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(25)">
      <rect width="20" height="100%" fill="#C9A24B" opacity="0.06"/>
      <rect x="20" width="20" height="100%" fill="#F2EDE4" opacity="0.04"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="2100" height="1000" fill="url(#heroGrad)"/>
  <rect width="2100" height="1000" fill="url(#fadeStripes)"/>
  <!-- Subtle dark overlay at bottom 40% for text legibility -->
  <linearGradient id="textFade" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#00000000"/>
    <stop offset="100%" stop-color="#000000"/>
  </linearGradient>
  <rect y="500" width="2100" height="500" fill="url(#textFade)"/>
  <!-- Barber chair silhouette (centered) -->
  <g transform="translate(1050 780)" opacity="0.15">
    <ellipse cx="0" cy="0" rx="110" ry="10" fill="#C9A24B" transform="rotate(-15)"/>
    <rect x="-30" y="-120" width="60" height="120" rx="30" fill="#1A1A1A"/>
    <circle cx="0" cy="-140" r="35" fill="#1A1A1A"/>
    <rect x="-40" y="-120" width="80" height="30" rx="15" fill="#C9A24B" opacity="0.3"/>
  </g>
  <!-- Tools arrangement (left side) -->
  <g transform="translate(300 800)" opacity="0.12" stroke="#C9A24B" stroke-width="3" fill="none">
    <path d="M0 0 L-50 -30 M0 0 L50 -30"/>
    <circle cx="0" cy="0" r="6" fill="#C9A24B"/>
    <path d="M50 -30 L60 -40 M50 -30 L60 -20"/>
    <circle cx="55" cy="-35" r="5" fill="#C9A24B"/>
  </g>
  <!-- Cedar branch detail (right side) -->
  <g transform="translate(1800 850)" opacity="0.1">
    <path d="M0 0 Q30 -20 60 0 T100 0" fill="none" stroke="#8B4513" stroke-width="5" stroke-linecap="round"/>
    <circle cx="30" cy="-15" r="5" fill="#8B4513"/>
    <circle cx="70" cy="10" r="5" fill="#8B4513"/>
  </g>
</svg>
