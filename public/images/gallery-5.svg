<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Classic red and white barber pole">
  <defs>
    <linearGradient id="g5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
    <pattern id="poleStripes" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse" patternTransform="rotate(20)">
      <rect width="15" height="100%" fill="#DC2626"/>
      <rect x="15" width="15" height="100%" fill="#F2EDE4"/>
    </pattern>
  </defs>
  <rect width="600" height="600" fill="url(#g5)"/>
  <g transform="translate(300 340)" opacity="0.9">
    <!-- Pole -->
    <rect x="-15" y="-200" width="30" height="400" fill="url(#poleStripes)"/>
    <!-- Top ball -->
    <circle cx="0" cy="-210" r="20" fill="#C9A24B"/>
    <circle cx="0" cy="-210" r="12" fill="#121212"/>
    <!-- Bottom base -->
    <rect x="-30" y="200" width="60" height="30" rx="15" fill="#1A1A1A" stroke="#C9A24B" stroke-width="2"/>
  </g>
</svg>
