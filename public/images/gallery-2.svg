<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Classic red barber chair">
  <defs>
    <linearGradient id="g2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#g2)"/>
  <g transform="translate(300 340)" opacity="0.85">
    <!-- Chair base -->
    <circle cx="0" cy="0" r="80" fill="#1A1A1A" stroke="#C9A24B" stroke-width="4"/>
    <path d="M0 -80 Q-20 -50 0 -20 Q20 -50 0 -80" fill="#FFFFFF10" stroke="none"/>
    <!-- Chair back/seat -->
    <rect x="-60" y="-20" width="120" height="70" rx="35" fill="#DC2626"/>
    <rect x="-30" y="50" width="60" height="80" rx="30" fill="#DC2626"/>
    <!-- Footrest -->
    <rect x="-60" y="130" width="120" height="15" rx="7" fill="#DC2626"/>
    <!-- Pedal -->
    <circle cx="0" cy="140" r="8" fill="#C9A24B"/>
    <!-- Chrome details -->
    <circle cx="0" cy="-30" r="12" fill="#CCCCCC"/>
    <circle cx="0" cy="20" r="8" fill="#CCCCCC"/>
  </g>
</svg>
